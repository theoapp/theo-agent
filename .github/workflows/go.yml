name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Check version
        run: DEBUG=true ./ci/version
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Print theo-agent -version
        run: ./build/theo-agent -version
      - name: Cross build
        env:
          CGO_ENABLED: 0
        run: |
          GOOS=linux GOARCH=amd64 make -e buildx
      - name: Run the static binary on Ubuntu 20.04
        run: docker run --rm -v "$PWD/build:/build:ro" ubuntu:20.04 /build/theo-agent-Linux-x86_64 -version
      - name: Upload theo-agent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theo-agent-Linux-x86_64
          path: build/theo-agent-Linux-x86_64
